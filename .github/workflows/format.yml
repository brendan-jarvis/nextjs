name: format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Blocking. Prettier + prettier-plugin-tailwindcss on the pinned stable Bun
  # (packageManager in package.json). Same config, and byte-identical output, as `bun fmt`.
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:prettier:check

  # Non-blocking until `bun fmt` ships in a stable Bun release (canary-only as of
  # Bun 1.4.4-canary.1). Then: pin that version in package.json, make this job
  # blocking, drop the prettier job and the prettier devDependencies.
  bun-fmt:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun --revision
      # tailwindcss must be installed for class sorting
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
